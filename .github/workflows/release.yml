name: release

on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"
    - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
    - "[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check release version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check tag against package version
      if: startsWith(github.ref, 'refs/tags/')
      run: >-
        python -c "import os, pathlib, tomllib;
        version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
        tag = os.environ['GITHUB_REF_NAME'];
        assert tag == version, f'{tag!r} does not match package version {version!r}'"

  build-wheels:
    name: Build ${{ matrix.platform.name }} wheel
    needs: check-version
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
        - name: Linux x86-64
          id: linux-x86_64
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          manylinux: "2_17"
          interpreter: python3.10
          setup_python: false
        - name: Linux ARM64
          id: linux-aarch64
          runner: ubuntu-24.04
          target: aarch64-unknown-linux-gnu
          manylinux: "2_17"
          interpreter: python3.10
          setup_python: false
        - name: macOS Intel
          id: macos-x86_64
          runner: macos-15-intel
          target: x86_64-apple-darwin
          manylinux: "off"
          interpreter: python
          setup_python: true
          python_architecture: x64
        - name: macOS Apple Silicon
          id: macos-aarch64
          runner: macos-latest
          target: aarch64-apple-darwin
          manylinux: "off"
          interpreter: python
          setup_python: true
          python_architecture: arm64
        - name: Windows x86-64
          id: windows-x86_64
          runner: windows-latest
          target: x86_64-pc-windows-msvc
          manylinux: "off"
          interpreter: python
          setup_python: true
          python_architecture: x64

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.10
      if: matrix.platform.setup_python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"
        architecture: ${{ matrix.platform.python_architecture }}
    - name: Build wheel
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        maturin-version: v1.15.0
        rust-toolchain: "1.96"
        target: ${{ matrix.platform.target }}
        manylinux: ${{ matrix.platform.manylinux }}
        args: >-
          --release --locked --out dist --compatibility pypi
          --interpreter ${{ matrix.platform.interpreter }}
    - name: Upload wheel
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-wheel-${{ matrix.platform.id }}
        path: dist/*.whl
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  build-sdist:
    name: Build source distribution
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build source distribution
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        maturin-version: v1.15.0
        rust-toolchain: "1.96"
        command: sdist
        args: --out dist
    - name: Upload source distribution
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-sdist
        path: dist/*.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prune-source
    permissions:
      id-token: write
    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.10"
        enable-cache: false
    - name: Download distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: release-*
        path: dist
        merge-multiple: true
    - name: Generate PEP 740 attestations
      uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
    - name: Publish
      run: uv publish --trusted-publishing always
