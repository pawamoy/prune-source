[package]
name = "prune-source"
version = "0.1.6"
edition = "2024"
rust-version = "1.96"
license = "ISC"
description = "Prune Python function bodies before compiling abstract syntax trees."
publish = false

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py311", "extension-module"] }
# Ruff's component crates intentionally have no stable Rust API and must stay in lockstep.
ruff_python_ast = "=0.0.15"
ruff_python_parser = "=0.0.15"
unicode-normalization = "0.1.25"

[profile.release]
codegen-units = 1
lto = "thin"
